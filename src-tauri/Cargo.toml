[package]
name = "gacha-hub"
version = "0.1.0"
description = "Custom launcher for gacha games with a mini-hub (news, promo codes, guides)"
edition = "2021"

[lib]
name = "gacha_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Запоминает размер и положение окна между запусками.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows registry access: Steam install path (custom installs).
winreg = "0.52"
# Small blocking https client for the remote hub (native-tls on Windows).
ureq = { version = "2", features = ["json"] }
